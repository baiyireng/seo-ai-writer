ai:
    platform:
        # Inference Platform configuration
        # see https://github.com/symfony/ai/tree/main/src/platform#platform-bridges

         openai:
            api_key: '%env(OPENAI_API_KEY)%'

    agent:
        # Agent configuration
        # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html

        default:
            platform: 'ai.platform.openai'
            model: 'gpt-3.5-turbo'
            prompt: |
                You are a professional SEO content writing assistant, skilled at writing clear, readable articles.
            tools: []

        seo_writer: # ← 这个名称会自动绑定到 $seoWriter 参数
            model: 'gpt-3.5-turbo'
            tools: [ 'App\Tool\SearchTool' ]

    store:
        # Store configuration

        # chromadb:
